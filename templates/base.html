<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Busy Working Fantasy Assistant
        {% endblock %}
    </title>

    {% block favicon %}
    <link
        rel="icon"
        type="image/png"
        href="{{ url_for(
            'static',
            filename='favicons/busy_working.png'
        ) }}"
    >
    {% endblock %}

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='busy_overlay.css'
        ) }}"
    >

    <script
        defer
        src="{{ url_for(
            'static',
            filename='busy_overlay.js'
        ) }}"
    ></script>

    {% block head_extra %}{% endblock %}
</head>

<body>
    <div
        id="busy-overlay"
        class="busy-overlay"
        aria-hidden="true"
        aria-live="polite"
    >
        <div
            class="busy-overlay-card"
            role="status"
        >
            <div
                class="busy-overlay-spinner"
                aria-hidden="true"
            ></div>

            <strong data-busy-message>
                Updating data…
            </strong>

            <span data-busy-detail>
                Refreshing Yahoo data and rebuilding analysis.
            </span>
        </div>
    </div>

    {% block header %}{% endblock %}

    <main class="{% block main_class %}container{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% include "_yahoo_footer.html" %}

    {% block scripts %}{% endblock %}
</body>

</html>

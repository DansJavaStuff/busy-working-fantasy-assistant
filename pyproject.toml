[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git",
    "venv",
    "backups",
    "data",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
